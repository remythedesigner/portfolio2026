<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found · Rémy Tartanac</title>
  <meta name="description" content="This page doesn't exist. Head back to the portfolio of Rémy Tartanac, freelance product designer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap"></noscript>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :focus-visible { outline: 2px solid #10042c; outline-offset: 3px; border-radius: 4px; }
    body { font-family: 'Cormorant Garamond', Georgia, serif; background: #e6e0f2; color: #10042c; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: 64px; line-height: 64px; font-weight: 500; margin-bottom: 24px; }
    p { font-family: 'Lato', sans-serif; font-size: 18px; line-height: 28px; margin-bottom: 32px; }
    .links { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
    a.btn { font-family: 'Lato', sans-serif; font-size: 16px; font-weight: 700; color: #fff; background: #10042c; text-decoration: none; padding: 16px 32px; border-radius: 9999px; }
    a.btn.secondary { color: #10042c; background: transparent; border: 1px solid #10042c; }
    @media (max-width: 480px) { h1 { font-size: 48px; line-height: 48px; } }
  </style>
</head>
<body>
  <main>
    <h1 id="nf-title">This page took a wrong turn.</h1>
    <p id="nf-text">The link may be broken or the page may have moved. The projects are one click away.</p>
    <div class="links">
      <a class="btn" id="nf-home" href="/">Back to home</a>
      <a class="btn secondary" id="nf-projects" href="/#projects">See the projects</a>
    </div>
  </main>
  <script>
    // French version for any missing URL under /fr/
    if (location.pathname.indexOf('/fr/') === 0) {
      document.documentElement.lang = 'fr';
      document.title = 'Page introuvable · Rémy Tartanac';
      document.getElementById('nf-title').textContent = 'Cette page s\u2019est perdue en route.';
      document.getElementById('nf-text').textContent = 'Le lien est peut-\u00eatre cass\u00e9, ou la page a chang\u00e9 d\u2019adresse. Les projets sont \u00e0 un clic.';
      var home = document.getElementById('nf-home'), projects = document.getElementById('nf-projects');
      home.textContent = 'Retour \u00e0 l\u2019accueil'; home.href = '/fr/';
      projects.textContent = 'Voir les projets'; projects.href = '/fr/#projects';
    }
  </script>
</body>
</html>
